name: pg-mm-dd-yyyy

services:
  postgres:
    build: .
    image: orahome-pg-mm-dd-yyyy:pg17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mmddyyyy_lab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mmddyyyy_lab"]
      interval: 1s
      timeout: 5s
      retries: 30
    volumes:
      - ./:/project:ro
    ports:
      - "55436:5432"